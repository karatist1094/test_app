<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Задачи</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <h1>Список задач</h1>
    <p>Планируй дела и разбирай их по категориям</p>
  </header>
  <div id="error"></div>

  <main>
    <section>
      <div class="section-head">
        <h2>Задачи</h2>
        <span class="badge" id="task-count">0</span>
      </div>

      <div class="progress">
        <div class="progress-text" id="progress-text">Выполнено 0 из 0</div>
        <div class="progress-bar"><div id="progress-fill"></div></div>
      </div>

      <form id="task-form">
        <input type="text" id="task-title" placeholder="Что нужно сделать?" required>
        <button type="submit" class="primary">Добавить</button>
      </form>
      <ul id="tasks"></ul>
    </section>

    <section>
      <div class="section-head">
        <h2>Категории</h2>
        <span class="badge" id="category-count">0</span>
      </div>

      <form id="category-form">
        <input type="text" id="category-name" placeholder="Новая категория" required>
        <button type="submit" class="primary">+</button>
      </form>
      <ul id="categories"></ul>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
